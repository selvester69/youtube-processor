<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Local YouTube & Shorts AI Hashtag Analyzer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background-color: #0f0f0f; color: #f1f1f1; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .navbar { background-color: #212121; border-bottom: 1px solid #383838; }
        .card { background-color: #212121; border: 1px solid #383838; border-radius: 12px; }
        .badge-short { background-color: #ff0000; color: #fff; }
        .badge-video { background-color: #065fd4; color: #fff; }
        .hashtag-box { background-color: #121212; border: 1px solid #383838; border-radius: 8px; padding: 12px; color: #3ea6ff; font-family: monospace; word-break: break-all; }
        .btn-youtube { background-color: #cc0000; color: white; border: none; }
        .btn-youtube:hover { background-color: #990000; color: white; }
        .status-pill { font-size: 0.85rem; padding: 4px 10px; border-radius: 20px; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark mb-4">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center gap-2 fw-bold" href="#">
            <i class="bi bi-youtube text-danger fs-3"></i> Local YouTube AI Hashtag Analyzer
        </a>
        <div class="d-flex align-items-center gap-3">
            <span id="configStatus" class="status-pill bg-secondary text-white">Checking Config...</span>
            <button class="btn btn-outline-light btn-sm" onclick="loadVideos()"><i class="bi bi-arrow-clockwise"></i> Refresh</button>
        </div>
    </div>
</nav>

<div class="container">
    <div id="alertBox"></div>

    <div class="row mb-4">
        <div class="col-md-12">
            <div class="card p-3 d-flex flex-row align-items-center justify-content-between">
                <div>
                    <h5 class="m-0 fw-bold"><i class="bi bi-cpu text-info me-2"></i> Local AI Engine Status (Ollama / Llama3)</h5>
                    <small class="text-secondary">Generates high-reach hashtags for YouTube Videos & Shorts locally for $0 costs.</small>
                </div>
                <span class="badge bg-success p-2 fs-6"><i class="bi bi-check-circle me-1"></i> Active</span>
            </div>
        </div>
    </div>

    <h4 class="fw-bold mb-3"><i class="bi bi-collection-play me-2"></i> Your YouTube Content</h4>

    <div id="loadingSpinner" class="text-center my-5">
        <div class="spinner-border text-danger" role="status" style="width: 3rem; height: 3rem;">
            <span class="visually-hidden">Loading...</span>
        </div>
        <p class="mt-3 text-secondary">Syncing videos from YouTube / Local DB...</p>
    </div>

    <div class="row g-4" id="videoGrid"></div>
</div>

<script>
    async function checkStatus() {
        try {
            const res = await fetch('/api/status');
            const data = await res.json();
            const statusEl = document.getElementById('configStatus');
            if (data.youtubeConfigured) {
                statusEl.className = 'status-pill bg-success text-white';
                statusEl.innerHTML = '<i class="bi bi-shield-check me-1"></i> OAuth Connected';
            } else {
                statusEl.className = 'status-pill bg-warning text-dark';
                statusEl.innerHTML = '<i class="bi bi-info-circle me-1"></i> Demo Mode (Missing client_secret.json)';
            }
        } catch (e) {
            console.error('Failed to check status:', e);
        }
    }

    async function loadVideos() {
        document.getElementById('loadingSpinner').style.display = 'block';
        document.getElementById('videoGrid').innerHTML = '';
        try {
            const res = await fetch('/api/videos');
            const videos = await res.json();
            renderVideos(videos);
        } catch (e) {
            showAlert('danger', 'Failed to fetch videos from server: ' + e.message);
        } finally {
            document.getElementById('loadingSpinner').style.display = 'none';
        }
    }

    function renderVideos(videos) {
        const grid = document.getElementById('videoGrid');
        if (!videos || videos.length === 0) {
            grid.innerHTML = '<div class="col-12"><div class="alert alert-secondary text-center">No videos found.</div></div>';
            return;
        }

        grid.innerHTML = videos.map(v => `
            <div class="col-md-6 col-lg-4">
                <div class="card h-100 shadow-sm">
                    <img src="${v.thumbnailUrl || 'https://picsum.photos/300/200'}" class="card-img-top" alt="${v.title}" style="height: 180px; object-fit: cover;">
                    <div class="card-body d-flex flex-column">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <span class="badge ${v.short ? 'badge-short' : 'badge-video'}">
                                ${v.short ? '<i class="bi bi-lightning-fill"></i> Short (9:16)' : '<i class="bi bi-play-btn-fill"></i> Video'}
                            </span>
                            <small class="text-secondary"><i class="bi bi-eye"></i> ${v.viewCount ? v.viewCount.toLocaleString() : 0} views</small>
                        </div>
                        <h6 class="card-title fw-bold text-white mb-2">${escapeHtml(v.title)}</h6>
                        <p class="card-text text-secondary small flex-grow-1">${escapeHtml(v.description || 'No description').substring(0, 100)}...</p>

                        ${v.generatedHashtags ? `
                            <div class="mt-2 mb-3">
                                <label class="form-label small text-info fw-bold mb-1"><i class="bi bi-hash"></i> AI Generated Hashtags:</label>
                                <div class="hashtag-box small">${v.generatedHashtags}</div>
                                ${v.updatedOnYoutube ? '<span class="badge bg-success mt-1"><i class="bi bi-check2-all"></i> Synced to YouTube</span>' : ''}
                            </div>
                        ` : ''}

                        <div class="d-grid gap-2 mt-auto">
                            <button class="btn btn-outline-info btn-sm" id="btn-gen-${v.videoId}" onclick="generateHashtags('${v.videoId}')">
                                <i class="bi bi-magic me-1"></i> ${v.generatedHashtags ? 'Re-Generate AI Hashtags' : 'Generate AI Hashtags'}
                            </button>
                            <button class="btn btn-youtube btn-sm" id="btn-update-${v.videoId}" onclick="analyzeAndUpdate('${v.videoId}')">
                                <i class="bi bi-upload me-1"></i> Analyze & Update YouTube
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        `).join('');
    }

    async function generateHashtags(videoId) {
        const btn = document.getElementById(`btn-gen-${videoId}`);
        if (btn) btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> Processing AI...';
        try {
            const res = await fetch(`/api/analyze/${videoId}`, { method: 'POST' });
            if (res.ok) {
                showAlert('success', 'AI Hashtags generated successfully!');
                loadVideos();
            } else {
                showAlert('danger', 'Failed to generate hashtags.');
            }
        } catch (e) {
            showAlert('danger', 'Error: ' + e.message);
        }
    }

    async function analyzeAndUpdate(videoId) {
        const btn = document.getElementById(`btn-update-${videoId}`);
        if (btn) btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> Syncing to YouTube...';
        try {
            const res = await fetch(`/api/analyze-and-update/${videoId}`, { method: 'POST' });
            if (res.ok) {
                showAlert('success', 'Hashtags generated and YouTube video description updated!');
                loadVideos();
            } else {
                showAlert('danger', 'Failed to update YouTube description.');
            }
        } catch (e) {
            showAlert('danger', 'Error: ' + e.message);
        }
    }

    function showAlert(type, msg) {
        const box = document.getElementById('alertBox');
        box.innerHTML = `<div class="alert alert-${type} alert-dismissible fade show" role="alert">
            ${msg}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>`;
        setTimeout(() => { box.innerHTML = ''; }, 5000);
    }

    function escapeHtml(str) {
        return (str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    window.onload = () => {
        checkStatus();
        loadVideos();
    };
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
